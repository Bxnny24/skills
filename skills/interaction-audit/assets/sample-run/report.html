<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Interaction audit</title>
<!--
  Report template for the interaction-audit skill.
  scripts/build_report.py replaces the JSON placeholder in #report-data and
  writes the result as report.html into the run folder. All rendering happens
  in the script at the bottom, so the design lives only in this file.
  Preview: python3 scripts/build_report.py assets/sample-run --lang de
-->
<style>
/* Concept: a dense work list. One overview line, small filters, and plain
   tables that stay tables at every width (they scroll sideways when narrow). */
:root{
  --bg:#ffffff; --fg:#1d2024; --muted:#5f6670; --line:#e1e4e8; --head:#f5f6f8; --hover:#f8f9fb;
  --accent:#0b6a6f;
  --a:#c62828; --b:#c56a00; --c:#2e60b5; --d:#6b7280;
  --fix:#c62828; --decide:#c56a00; --leave:#4f7a55; --unchecked:#6b7280; --ok:#2d7a46;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141619; --fg:#e8eaed; --muted:#9aa1ab; --line:#2b2f35; --head:#1b1e22; --hover:#1a1d21;
  --accent:#4fb3b1; --a:#ff6b63; --b:#f2a33a; --c:#7aa2ff; --d:#9ca3af;
  --fix:#ff6b63; --decide:#f2a33a; --leave:#8fbf92; --unchecked:#9ca3af; --ok:#5fc27f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141619; --fg:#e8eaed; --muted:#9aa1ab; --line:#2b2f35; --head:#1b1e22; --hover:#1a1d21;
  --accent:#4fb3b1; --a:#ff6b63; --b:#f2a33a; --c:#7aa2ff; --d:#9ca3af;
  --fix:#ff6b63; --decide:#f2a33a; --leave:#8fbf92; --unchecked:#9ca3af; --ok:#5fc27f; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13.5px/1.45 var(--sans)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wrap{padding-block:14px 40px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:grid;gap:16px}

/* Overview: title, one line of counts, filters */
.top{display:grid;gap:8px}
h1{margin:0;font-size:17px;font-weight:700}
.counts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.counts b{color:var(--fg);font-variant-numeric:tabular-nums}
.f{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:3px 8px;font:inherit;font-size:12.5px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.f i{width:8px;height:8px;border-radius:2px;background:var(--t)}
.f[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.search{flex:1 1 200px;min-width:0;max-width:340px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:4px 8px;font:inherit}

/* Tables */
section{display:grid;gap:6px;min-width:0}
h2{margin:0;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center}
h2 i{width:10px;height:10px;border-radius:2px;background:var(--t)}
h2 span{color:var(--muted);font-weight:500}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:1000px}
table.narrow{min-width:560px}
th{position:sticky;top:0;background:var(--head);text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
td.no{font:600 13px var(--mono);width:1%;white-space:nowrap}
td.p{width:1%}
td.w{font-weight:600;min-width:160px}
td.w i{font-style:normal;color:var(--muted);font-weight:400;padding:0 3px}
td.pr{width:1%}
.g{display:inline-block;min-width:20px;padding:1px 0;text-align:center;border-radius:4px;font:700 12px/18px var(--mono);color:#fff;background:var(--gc)}
.g.A{--gc:var(--a)}.g.B{--gc:var(--b)}.g.C{--gc:var(--c)}.g.D{--gc:var(--d)}
.th{display:flex;gap:4px}
.th button{display:block;padding:0;border:1px solid var(--line);border-radius:4px;background:var(--head);cursor:zoom-in;overflow:hidden;width:128px;height:90px}
.th img{display:block;width:100%;height:100%;object-fit:cover;object-position:top left}
.th video{display:block;width:120px;border-radius:4px}
.miss{font:11.5px var(--mono);color:var(--a)}
code{font:12px var(--mono);background:var(--head);padding:0 4px;border-radius:3px}
.opt{display:block}

/* Checklist */
details{border:1px solid var(--line);border-radius:6px}
details > summary{cursor:pointer;padding:6px 8px;font-weight:600;background:var(--head)}
details > summary span{color:var(--muted);font-weight:400}
details .scroll{border:0;border-top:1px solid var(--line);border-radius:0}
.st{font:600 11px var(--mono);text-transform:uppercase}
.st.ok{color:var(--ok)}.st.problem{color:var(--a)}.st.blocked,.st.not-reachable{color:var(--unchecked)}.st.skipped,.st.asked{color:var(--b)}
.cmp{font:600 11px var(--mono);text-transform:uppercase;display:block}
.cmp.changed{color:var(--a)}.cmp.new{color:var(--c)}.cmp.same{color:var(--ok)}
.mini{font:inherit;font-size:11.5px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px;padding:1px 6px;cursor:pointer;margin-top:3px}

dialog#lb{border:0;padding:0;background:transparent;max-width:96vw;max-height:94vh}
dialog#lb::backdrop{background:rgba(10,12,14,.85)}
dialog#lb img{display:block;max-width:96vw;max-height:88vh;border-radius:6px;background:#fff}
dialog#lb p{margin:4px 0 0;text-align:center;font:11.5px var(--mono);color:#ddd}
</style>
</head>

  }

  var GROUPS = [["fix", "var(--fix)"], ["decide", "var(--decide)"], ["leave", "var(--leave)"]];
  var c = D.counts;

  var html = '<div class="top"><h1>' + esc(D.title) + "</h1>" +
    '<div class="counts"><span><b>' + c.items + "</b> " + esc(L.itemsChecked) + "</span>" +
    GROUPS.map(function (g) { return '<button type="button" class="f" data-group="' + g[0] + '" style="--t:' + g[1] + '" aria-pressed="false"><i></i><b>' + c[g[0]] + "</b> " + esc(L.groups[g[0]]) + "</button>"; }).join("") +
    '<button type="button" class="f" data-group="unchecked" style="--t:var(--unchecked)" aria-pressed="false"><i></i><b>' + c.unchecked + "</b> " + esc(L.groups.unchecked) + "</button>" +
    (D.compared ? "<span>· " + esc(L.comparedWith) + " <code>" + esc(D.compared) + "</code>: <b>" + c.changed + "</b> " + esc(L.changedShots) + "</span>" : "") +
    (D.generated ? "<span>· " + esc(D.generated) + "</span>" : "") + "</div>" +
    '<div class="bar"><button type="button" class="f" data-prio="all" aria-pressed="true">' + esc(L.allPrios) + "</button>" +
    ["A", "B", "C", "D"].map(function (p) { return '<button type="button" class="f" data-prio="' + p + '" aria-pressed="false">' + grade(p) + esc(L.prioNames[p]) + "</button>"; }).join("") +
    '<input id="q" class="search" type="search" placeholder="' + esc(L.search) + '" aria-label="' + esc(L.search) + '"></div></div>';

  GROUPS.forEach(function (g) {
    var rows = D.findings.filter(function (f) { return f.group === g[0]; });
    if (!rows.length) return;
    var leave = g[0] === "leave", decide = g[0] === "decide";
    var head = leave ? [C.no, C.prio, C.where, C.what, C.leave, C.proof]
      : [C.no, C.prio, C.where, C.do, C.happens, C.should, C.why, decide ? C.options : C.fix, C.proof];
    html += '<section data-group="' + g[0] + '"><h2 style="--t:' + g[1] + '"><i></i>' + esc(L.groups[g[0]]) + " <span>" + rows.length + "</span></h2>" +
      table(leave ? "narrow" : "", head, rows.map(function (f) {
        var cells = leave
          ? [md(f.title), md(f.why)]
          : [md(f.steps.join(" → ")), md(f.actual), md(f.expected), md(f.why), decide ? opts(f.fix) : md(f.fix)];
        return '<tr data-prio="' + esc(f.prio) + '"><td class="no">' + f.no + '</td><td class="p">' + grade(f.prio) + '</td><td class="w">' + where(f.where) + "</td>" +
          cells.map(function (x) { return "<td>" + x + "</td>"; }).join("") + '<td class="pr">' + thumbs(f.media) + "</td></tr>";
      })) + "</section>";
  });

  if (D.unchecked.length) {
    html += '<section data-group="unchecked"><h2 style="--t:var(--unchecked)"><i></i>' + esc(L.groups.unchecked) + " <span>" + D.unchecked.length + "</span></h2>" +
      table("narrow", [C.no, C.prio, C.what, C.whynot, C.howcheck], D.unchecked.map(function (u) {
        return '<tr data-prio="' + esc(u.prio || "") + '"><td class="no">' + u.no + '</td><td class="p">' + grade(u.prio) + "</td><td>" + md(u.what) + "</td><td>" + md(u.why) + "</td><td>" + md(u.how) + "</td></tr>";
      })) + "</section>";
  }

  // Full checklist, collapsed per screen
  html += "<section><h2>" + esc(L.checklist) + " <span>" + c.items + "</span></h2>" + D.sections.map(function (sec) {
    var problems = sec.items.filter(function (i) { return i.status === "problem"; }).length;
    return "<details><summary>" + md(sec.title) + " <span>· " + sec.items.length + (problems ? " · " + problems + " " + esc(L.statuses.problem) : "") + "</span></summary>" +
      table("", ["ID", C.prio, C.what, C.should, "Status", C.proof], sec.items.map(function (it) {
        var media = it.media.map(function (m) {
          var tag = m.cmp ? '<span class="cmp ' + esc(m.cmp.state) + '">' + esc(L.cmp[m.cmp.state]) + (m.cmp.ratio != null ? " " + (m.cmp.ratio * 100).toFixed(2) + " %" : "") + "</span>" : "";
          if (m.cmp && m.cmp.state === "changed" && m.cmp.prev) {
            return tag + '<div class="th"><button type="button" data-src="' + esc(m.cmp.prevData || m.cmp.prev) + '" data-name="' + esc(L.previous) + '" title="' + esc(L.previous) + '"><img src="' + esc(m.cmp.prevData || m.cmp.prev) + '" alt=""></button>' +
              '<button type="button" class="cur" data-src="' + esc(src(m)) + '" data-alt="' + esc(m.cmp.prevData || m.cmp.prev) + '" data-name="' + esc(L.current) + '" title="' + esc(L.current) + '"><img src="' + esc(src(m)) + '" alt=""></button></div>' +
              '<button type="button" class="mini blink">' + esc(L.blink) + "</button>";
          }
          return tag + thumbs([m]);
        }).join("");
        return '<tr><td class="no">' + esc(it.id) + '</td><td class="p">' + grade(it.prio) + "</td><td>" + md(it.what) + "</td><td>" + md(it.expected) +
          '</td><td><span class="st ' + esc(it.status.replace(/ /g, "-")) + '">' + esc(L.statuses[it.status] || it.status) + "</span>" + (it.result && it.status !== "ok" ? "<br>" + md(it.result) : "") +
          '</td><td class="pr">' + media + "</td></tr>";
      })) + "</details>";
  }).join("") + "</section>";

  var app = document.getElementById("app");
  app.innerHTML = html;

  // Filters
  var state = { group: null, prio: "all", q: "" };
  function apply() {
    var q = state.q.toLowerCase();
    app.querySelectorAll("section[data-group]").forEach(function (sec) {
      var any = false;
      sec.querySelectorAll("tbody tr").forEach(function (tr) {
        var ok = (!state.group || sec.dataset.group === state.group) &&
          (state.prio === "all" || tr.dataset.prio === state.prio) && tr.textContent.toLowerCase().indexOf(q) !== -1;
        tr.hidden = !ok; any = any || ok;
      });
      sec.hidden = !any;
    });
  }
  app.querySelectorAll("[data-group].f").forEach(function (b) {
    b.addEventListener("click", function () {
      state.group = state.group === b.dataset.group ? null : b.dataset.group;
      app.querySelectorAll("[data-group].f").forEach(function (x) { x.setAttribute("aria-pressed", String(x.dataset.group === state.group)); });
      apply();
    });
  });
  app.querySelectorAll("[data-prio].f").forEach(function (b) {
    b.addEventListener("click", function () {
      state.prio = b.dataset.prio;
      app.querySelectorAll("[data-prio].f").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      apply();
    });
  });
  document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value; apply(); });

  // Lightbox and blink comparison
  var lb = document.getElementById("lb");
  app.addEventListener("click", function (e) {
    var blink = e.target.closest(".blink");
    if (blink) {
      var cur = blink.previousElementSibling.querySelector(".cur"), img = cur.querySelector("img");
      if (blink._t) { clearInterval(blink._t); blink._t = null; img.src = cur.dataset.src; blink.textContent = L.blink; return; }
      var on = false;
      blink._t = setInterval(function () { on = !on; img.src = on ? cur.dataset.alt : cur.dataset.src; }, 600);
      blink.textContent = L.stop;
      return;
    }
    var t = e.target.closest(".th button");
    if (t) {
      lb.querySelector("img").src = t.dataset.src;
      lb.querySelector("p").textContent = t.dataset.name || "";
      if (lb.showModal) lb.showModal(); else lb.setAttribute("open", "");
    }
  });
  lb.addEventListener("click", function () { if (lb.close) lb.close(); else lb.removeAttribute("open"); });
})();
</script>
</body>
</html>
